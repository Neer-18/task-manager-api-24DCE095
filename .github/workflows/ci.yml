name: CI Pipeline

# Practical 12: CI/CD Pipeline with GitHub Actions
# Triggers: Runs automatically on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (Node 18 LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Run automated test suite
      - name: Run Automated Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_super_secret_jwt_key_24dce095
